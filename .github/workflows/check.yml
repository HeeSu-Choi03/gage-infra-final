# push마다 코드 점검만 자동으로 한다. plan/apply는 VPN 안의 PC에서 사람이 plan을 읽고 실행한다.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt / validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: trivy config (정적 분석)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:latest config --exit-code 1 /src
      - name: policy as code selftest (P1~P5가 위반 샘플을 잡는지)
        run: python3 policies/check_plan.py --selftest
      - name: gitleaks (커밋 이력 전체 시크릿 검사)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
